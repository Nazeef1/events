---
# analytics-service: one replica. The init container applies database migrations before the app starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  labels: {app: analytics-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: analytics-service}
  template:
    metadata:
      labels: {app: analytics-service}
    spec:
      initContainers:
        - name: migrate
          image: eventsphere/analytics-service:local
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: eventsphere-env
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventsphere-env
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/analytics_db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eventsphere-env
                  key: JWT_SECRET
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: eventsphere-env
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventsphere-env
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/%2F"
            - name: CORS_ORIGINS
              value: '["http://localhost:3000"]'
      containers:
        - name: app
          image: eventsphere/analytics-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: eventsphere-env
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventsphere-env
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/analytics_db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eventsphere-env
                  key: JWT_SECRET
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: eventsphere-env
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventsphere-env
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/%2F"
            - name: CORS_ORIGINS
              value: '["http://localhost:3000"]'
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 320Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
spec:
  selector: {app: analytics-service}
  ports:
    - port: 8000
      targetPort: 8000
