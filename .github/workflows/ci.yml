name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/identity-service
          - services/event-service
          - services/booking-service
          - services/payment-service
          - services/notification-service
          - services/refund-service
          - services/analytics-service
          - api-gateway
    # Some suites deliberately test against a real Redis and RabbitMQ, not mocks.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci
        ports: ["5672:5672"]
        # Probes the HTTP port rather than running rabbitmq-diagnostics, which can race the broker's boot.
        # 127.0.0.1, not localhost: inside the container localhost resolves to ::1, where RabbitMQ isn't listening.
        options: >-
          --health-cmd "wget -q --spider http://127.0.0.1:15672 || exit 1" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_RABBITMQ_URL: amqp://ci:ci@localhost:5672/%2F
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install shared library where requirements.txt expects it
        # requirements.txt installs `-e /shared/common`, matching the Docker image layout.
        run: |
          sudo mkdir -p /shared
          sudo cp -r shared/common /shared/common
          sudo chown -R "$USER" /shared
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements.txt pytest httpx
      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: python -m pytest -q -p no:cacheprovider

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml with the example settings
        run: |
          cp .env.example .env
          docker compose --profile tools config --quiet
